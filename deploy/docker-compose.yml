# ECV Cash: banco, migrações, API e o site (Caddy) num servidor onde o Traefik já cuida das portas 80/443 e do HTTPS.
# Uso: cd deploy && ./gerar-env.sh DOMINIO REDE_TRAEFIK CERTRESOLVER && docker compose up -d --build
# Passo a passo: deploy/INSTALAR-NA-VPS.md
name: ecv-cash

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      ECV_OWNER_PW: ${ECV_OWNER_PW:?defina no .env}
      ECV_APP_PW: ${ECV_APP_PW:?defina no .env}
      ECV_DB: ecv_cash
    volumes:
      - dados:/var/lib/postgresql/data
      - ../apps/api/db/bootstrap.sql:/bootstrap.sql:ro
      - ./iniciar-banco.sh:/docker-entrypoint-initdb.d/10-iniciar-banco.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecv_cash"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [interna]
    # sem "ports": o banco não é acessível de fora do servidor

  migrar:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    image: ecv-cash-api
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    environment:
      # só este serviço conhece a senha do dono do banco
      DATABASE_URL_OWNER: postgres://ecv_owner:${ECV_OWNER_PW}@db:5432/ecv_cash
    networks: [interna]
    command: ["node", "dist/db/migrate.js"]

  api:
    image: ecv-cash-api
    restart: unless-stopped
    depends_on:
      migrar: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://ecv_app:${ECV_APP_PW}@db:5432/ecv_cash
      CHAVE_SEGREDOS: ${CHAVE_SEGREDOS:?defina no .env}
      ORIGENS_PERMITIDAS: https://app.${DOMINIO},https://admin.${DOMINIO}
      URL_APP: https://app.${DOMINIO}
      URL_BACKOFFICE: https://admin.${DOMINIO}
      EXPOR_CONVITE: "true"
      # Traefik -> Caddy -> API: dois proxies na frente
      TRUST_PROXY_SALTOS: "2"
    networks: [interna]
    # sem "ports": só o Caddy fala com a API

  site:
    build: { context: .., dockerfile: deploy/Dockerfile.caddy }
    restart: unless-stopped
    depends_on: [api]
    environment:
      DOMINIO: ${DOMINIO:?defina no .env}
    networks:
      interna: {}
      traefik:
        # apelido único: a rede do Traefik é compartilhada com outros projetos
        aliases: [ecv-cash-site]
    # sem "ports": quem recebe a internet é o Traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${REDE_TRAEFIK:?defina no .env}
      traefik.http.services.ecv-cash.loadbalancer.server.port: "80"
      # sistema
      traefik.http.routers.ecv-cash-app.rule: Host(`app.${DOMINIO}`)
      traefik.http.routers.ecv-cash-app.entrypoints: ${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}
      traefik.http.routers.ecv-cash-app.tls: "true"
      traefik.http.routers.ecv-cash-app.tls.certresolver: ${TRAEFIK_CERTRESOLVER:?defina no .env}
      traefik.http.routers.ecv-cash-app.service: ecv-cash
      # backoffice
      traefik.http.routers.ecv-cash-admin.rule: Host(`admin.${DOMINIO}`)
      traefik.http.routers.ecv-cash-admin.entrypoints: ${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}
      traefik.http.routers.ecv-cash-admin.tls: "true"
      traefik.http.routers.ecv-cash-admin.tls.certresolver: ${TRAEFIK_CERTRESOLVER:?defina no .env}
      traefik.http.routers.ecv-cash-admin.service: ecv-cash
      # HTTP -> HTTPS (só para estes dois endereços)
      traefik.http.middlewares.ecv-cash-https.redirectscheme.scheme: https
      traefik.http.routers.ecv-cash-http.rule: Host(`app.${DOMINIO}`) || Host(`admin.${DOMINIO}`)
      traefik.http.routers.ecv-cash-http.entrypoints: ${TRAEFIK_ENTRYPOINT_HTTP:-web}
      traefik.http.routers.ecv-cash-http.middlewares: ecv-cash-https

  # Cria o primeiro usuário da equipe interna: docker compose run --rm criar-interno "Nome" email PLATAFORMA
  criar-interno:
    image: ecv-cash-api
    profiles: ["ferramentas"]
    depends_on:
      migrar: { condition: service_completed_successfully }
    environment:
      DATABASE_URL_OWNER: postgres://ecv_owner:${ECV_OWNER_PW}@db:5432/ecv_cash
    networks: [interna]
    entrypoint: ["node", "dist/db/criar-interno.js"]

networks:
  interna: {}
  traefik:
    external: true
    name: ${REDE_TRAEFIK:?defina no .env}

volumes:
  dados:
