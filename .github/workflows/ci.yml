name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Papéis e banco
        run: ECV_OWNER_PW=owner ECV_APP_PW=app scripts/db-bootstrap.sh -h localhost -U postgres
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build dos três apps
        run: pnpm build

  docker:
    # Monta as imagens e sobe o conjunto de verdade (banco, migrações, API e site), como na VPS, só sem o Traefik.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rede de mentira para o Traefik e .env de teste
        run: |
          docker network create traefik_ci
          deploy/gerar-env.sh ci.local traefik_ci letsencrypt
      - name: Montar e subir
        working-directory: deploy
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
      - name: Esperar o site e a API responderem
        run: |
          # o site sobe antes da API terminar de iniciar: espera a API responder (401 sem login) e não só o site
          for i in $(seq 1 90); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: app.ci.local' http://127.0.0.1:8080/api/auth/eu)" = 401 ] && break
            sleep 2
          done
      - name: Conferir
        run: |
          set -x
          # as telas do sistema e do backoffice são servidas
          curl -fsS -H 'Host: app.ci.local' http://127.0.0.1:8080/ | grep -q '<div id="raiz">'
          curl -fsS -H 'Host: admin.ci.local' http://127.0.0.1:8080/ | grep -q '<div id="raiz">'
          # uma rota de tela desconhecida cai no index (a navegação é no navegador)
          curl -fsS -H 'Host: app.ci.local' http://127.0.0.1:8080/laudos | grep -q '<div id="raiz">'
          # a API responde atrás do /api: sem login, 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: app.ci.local' http://127.0.0.1:8080/api/auth/eu)" = 401
          # as migrações rodaram até a última
          cd deploy
          docker compose exec -T db psql -U postgres -d ecv_cash -tAc "select count(*) from schema_migracao" | grep -q '^[1-9]'
          # a aplicação roda com o papel sem BYPASSRLS
          docker compose exec -T db psql -U postgres -d ecv_cash -tAc "select rolbypassrls from pg_roles where rolname='ecv_app'" | grep -q '^f$'
          # o primeiro usuário interno pode ser criado
          docker compose run --rm criar-interno "CI" ci@ci.local PLATAFORMA | grep -q 'Usuário interno criado'
      - name: Logs em caso de falha
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color --tail 100
