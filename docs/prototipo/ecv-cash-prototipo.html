<title>ECV Cash Protótipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Layout: app de gestão com menu lateral por perfil, topo com empresa ativa; tabelas em largura total, formulários em até 1200px.
   Tema único (marfim do Design System ECV Cash); a cor da marca do cliente entra por --brand. */
:root{
  --marfim:#F7F8F2; --branco:#FFFFFF; --verde:#104B3A; --esm:#008B49; --claro:#80BC43;
  --texto:#18382E; --texto2:#52675F; --borda:#D9E0D8; --suave:#EAF3EC; --erro:#B42318; --aviso:#805600; --foco:#005FCC;
  --brand:#104B3A; --brand-hover:#0B3A2C; --brand-ink:#FFFFFF;
  --s1:#008B49; --s2:#2F6FD0; --s3:#C47A00; --s4:#9A5BC0; --s5:#D1462F;
  --fonte:"DejaVu Sans",Verdana,Geneva,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--marfim);color:var(--texto);font-family:var(--fonte);font-size:14px;line-height:1.5;margin:0}
h1,h2,h3,p{margin:0}
h1{font-size:28px;line-height:36px;color:var(--verde);text-wrap:balance}
h2{font-size:18px;line-height:26px;color:var(--verde)}
h3{font-size:14px;color:var(--verde)}
.mut{color:var(--texto2)} .sm{font-size:12px;line-height:18px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

.proto{background:#FFF6DC;border-bottom:1px solid #E7D49A;color:#5C4300;font-size:12px;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.proto select{height:32px;border:1px solid #C9B676;border-radius:8px;background:#fff;padding:0 8px}
.proto b{font-weight:700}
.imp{background:#104B3A;color:#fff;font-size:13px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imp button{background:#fff;color:#104B3A;border:0;border-radius:8px;height:32px;padding:0 12px;font-weight:700;cursor:pointer}

.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 80px)}
.side{background:var(--branco);border-right:1px solid var(--borda);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;font-weight:700;color:var(--verde);font-size:18px}
.logo i{width:36px;height:36px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink);font-style:normal;font-size:13px}
.logo small{display:block;font-weight:400;font-size:11px;color:var(--texto2)}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;color:var(--texto);text-decoration:none;font-weight:700;font-size:14px}
.nav a:hover{background:var(--suave)}
.nav a[aria-current=page]{background:var(--brand);color:var(--brand-ink)}
.nav svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .foot{margin-top:auto;padding:16px 8px 0;border-top:1px solid var(--borda);display:flex;flex-direction:column;gap:10px}
.side .foot img{width:112px;display:block}
.side .foot a{color:var(--texto2);font-size:12px}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.top{background:var(--branco);border-bottom:1px solid var(--borda);padding:10px max(24px,env(safe-area-inset-right,0px)) 10px max(24px,env(safe-area-inset-left,0px));display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top label{font-size:11px;color:var(--texto2);display:block}
.top select{height:40px;border:1px solid var(--borda);border-radius:8px;padding:0 10px;background:#fff;min-width:200px;font-weight:700}
.user{display:flex;gap:10px;align-items:center;font-size:13px}
.user b{display:block}
.av{width:36px;height:36px;border-radius:50%;background:var(--suave);color:var(--verde);display:grid;place-items:center;font-weight:700}
main{padding:28px max(24px,env(safe-area-inset-right,0px)) 40px max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:24px;min-width:0}
.narrow{max-width:1200px;width:100%}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.head p{max-width:64ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.card{background:var(--branco);border-radius:16px;padding:20px;min-width:0}
.card.line{border:1px solid var(--borda)}
.grid{display:grid;gap:16px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)} .g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.kpi .l{font-size:12px;color:var(--texto2)} .kpi .v{font-size:21px;line-height:30px;font-weight:700;color:var(--verde);font-variant-numeric:tabular-nums} .kpi .d{font-size:12px;color:var(--texto2)}

.btn{min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:var(--brand-hover)}
.btn.sec{background:#fff;color:var(--verde);border-color:var(--verde)} .btn.sec:hover{background:var(--suave)}
.btn.sm2{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{background:#D9E0DA;border-color:#D9E0DA;color:var(--texto2);cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label{font-weight:700;color:var(--verde);font-size:13px}
.fld input,.fld select,.fld textarea{min-height:48px;border:1.5px solid #8EA097;border-radius:8px;padding:0 12px;background:#fff;width:100%}
.fld textarea{padding:10px 12px;min-height:72px}
.fld input.bad{border-color:var(--erro)}
.fld small{font-size:12px;color:var(--texto2)}
.msg{display:flex;gap:10px;border-radius:12px;padding:12px 14px;font-size:13px;line-height:20px}
.msg.warn{background:#FFF3D9;color:#5C4300;border:1px solid #E6CF90}
.msg.err{background:#FBE9E7;color:#8A1B10;border:1px solid #E8B4AD}
.msg.ok{background:var(--suave);color:#0B3A2C;border:1px solid #BCD9C4}
.msg.info{background:#EAF1FB;color:#0E3A75;border:1px solid #B9CEEC}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.p-ok{background:#E3F1E7;color:#0B3A2C} .p-open{background:#F0F2EF;color:var(--texto);border-color:var(--borda)}
.p-par{background:#FFF1D6;color:var(--aviso)} .p-venc{background:#FBE4E1;color:var(--erro)} .p-info{background:#E8F0FB;color:#0E3A75}

.tw{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--texto2);padding:10px 12px;border-bottom:1.5px solid var(--borda);white-space:nowrap;background:#fff}
td{padding:11px 12px;border-bottom:1px solid #E8EDE6;vertical-align:middle}
tr.sel td{background:var(--suave)}
tbody tr:hover td{background:#F4F8F3}
tfoot td{font-weight:700;border-top:1.5px solid var(--borda);border-bottom:0}
td input[type=checkbox],th input[type=checkbox]{width:20px;height:20px;accent-color:var(--verde)}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--borda);flex-wrap:wrap}
.tabs button{background:none;border:0;padding:12px 16px;font-weight:700;color:var(--texto2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs button[aria-selected=true]{color:var(--verde);border-bottom-color:var(--brand)}
.chip{border:1.5px solid var(--borda);background:#fff;border-radius:999px;min-height:36px;padding:0 14px;font-weight:700;cursor:pointer}
.chip[aria-pressed=true]{background:var(--verde);color:#fff;border-color:var(--verde)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:128px minmax(0,1fr) 104px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:16px;background:#EEF2EC;border-radius:4px 8px 8px 4px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--verde);border-radius:0 8px 8px 0}
.bar .vv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.lg{display:flex;gap:16px;font-size:12px;color:var(--texto2);flex-wrap:wrap}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{position:relative}
.tip{position:absolute;pointer-events:none;background:#18382E;color:#fff;font-size:12px;padding:8px 10px;border-radius:8px;white-space:nowrap;z-index:5;display:none}
svg text{font-family:var(--fonte)}
.sw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
.list-i{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--borda);background:#fff;cursor:pointer;text-align:left;width:100%}
.list-i[aria-pressed=true]{border-color:var(--verde);background:var(--suave)}
.doc{background:#fff;border:1px solid var(--borda);border-radius:8px;padding:28px;box-shadow:0 1px 3px rgba(24,56,46,.12);max-width:640px}
.doc .lh{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid var(--brand);padding-bottom:14px;margin-bottom:14px}
.lbox{width:120px;height:44px;border:1.5px dashed #8EA097;border-radius:6px;display:grid;place-items:center;font-size:10px;color:var(--texto2);text-align:center;overflow:hidden;background:#fff}
.lbox img{max-width:100%;max-height:100%}
.ov{position:fixed;inset:0;background:rgba(16,40,32,.45);z-index:50;display:flex;justify-content:flex-end}
.ov.c{justify-content:center;align-items:center}
.dr{background:#fff;width:min(460px,100%);height:100%;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px 24px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.md{background:#fff;width:min(480px,calc(100% - 32px));border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--verde);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;z-index:99;display:none;max-width:calc(100% - 32px)}
.act{position:sticky;bottom:12px;background:var(--verde);color:#fff;border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.act .btn{background:#fff;color:var(--verde);border-color:#fff}
.lock{display:inline-flex;gap:6px;align-items:center;color:var(--texto2);font-size:12px}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{width:min(420px,100%);display:flex;flex-direction:column;gap:16px;padding:32px}
.bo-top{background:#fff;border-bottom:3px solid var(--verde);padding:12px max(24px,env(safe-area-inset-right,0px)) 12px max(24px,env(safe-area-inset-left,0px));display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap}
@media (max-width:1100px){.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12,.sw,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--borda)}
  .logo,.side .foot{display:none}.nav{display:flex;gap:4px}.nav a{white-space:nowrap}
  .g2{grid-template-columns:minmax(0,1fr)}.bar{grid-template-columns:96px minmax(0,1fr) 72px}
}
@media (prefers-reduced-motion:no-preference){.ov .dr{animation:sl .18s ease-out}@keyframes sl{from{transform:translateX(24px);opacity:.6}}}
</style>
<div id="app"></div>
<div id="ovl"></div>
<div id="toast" role="status"></div>

function lineChart(){
  const sh=shareE(),W=640,H=250,L=54,Rr=16,Tp=14,B=30,w=W-L-Rr,h=H-Tp-B;
  const a=FATU.map(v=>v*sh),b=RECE.map(v=>v*sh),max=Math.ceil(Math.max(...a)/100)*100;
  const x=i=>L+w*i/11,y=v=>Tp+h-(v/max)*h;
  const pth=s=>s.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  let g='';for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="#E4EAE3"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#52675F">${Math.round(v)}k</text>`}
  const xl=MESES.map((m,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#52675F">${m}</text>`).join('');
  const area=pth(a)+` L${x(11)} ${y(0)} L${x(0)} ${y(0)} Z`;
  return `<div class="chart" id="lc"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolução mensal de faturado e recebido, em milhares de reais">${g}${xl}
   <path d="${area}" fill="#008B49" fill-opacity=".08"/><path d="${pth(a)}" fill="none" stroke="#008B49" stroke-width="2" stroke-linejoin="round"/>
   <path d="${pth(b)}" fill="none" stroke="#2F6FD0" stroke-width="2" stroke-linejoin="round"/>
   <circle cx="${x(11)}" cy="${y(a[11])}" r="4.5" fill="#008B49" stroke="#fff" stroke-width="2"/><circle cx="${x(11)}" cy="${y(b[11])}" r="4.5" fill="#2F6FD0" stroke="#fff" stroke-width="2"/>
   <text x="${x(11)-8}" y="${y(a[11])-10}" text-anchor="end" font-size="11" font-weight="700" fill="#18382E">Faturado</text>
   <text x="${x(11)-8}" y="${y(b[11])+20}" text-anchor="end" font-size="11" font-weight="700" fill="#18382E">Recebido</text>
   <line id="lcx" y1="${Tp}" y2="${Tp+h}" stroke="#18382E" stroke-dasharray="3 3" style="display:none"/>
   <rect id="lch" x="${L}" y="${Tp}" width="${w}" height="${h}" fill="transparent"/></svg><div class="tip" id="lct"></div></div>
   <div class="lg"><span><i style="background:#008B49"></i>Faturado (competência)</span><span><i style="background:#2F6FD0"></i>Recebido (caixa)</span></div>`;
}

 const lote=`<div class="tw"><table><thead><tr><th>Placa</th><th>Cliente</th><th>Serviço</th><th>Forma</th><th class="num">Valor</th></tr></thead><tbody>${[0,1,2,3,4].map(i=>`<tr><td><input style="min-height:40px;width:110px;border:1.5px solid #8EA097;border-radius:8px;padding:0 8px" placeholder="ABC1D23" aria-label="Placa linha ${i+1}"></td>

   <td><select data-lote="${i}" data-k="s" aria-label="Serviço linha ${i+1}" style="min-height:40px;border:1.5px solid #8EA097;border-radius:8px">${opt(SERV,'Cautelar')}</select></td>
   <td><select aria-label="Forma linha ${i+1}" style="min-height:40px;border:1.5px solid #8EA097;border-radius:8px">${opt(FORMAS,'Faturado')}</select></td><td class="num" id="lv${i}">${R(180)}</td></tr>`).join('')}</tbody></table></div>
   <div class="row" style="justify-content:space-between"><p class="mut sm">Linhas em branco são ignoradas. Cliente sem preço fica em amarelo e pede valor.</p><button class="btn" data-a="lote">Lançar laudos do lote</button></div>`;
 return `<div class="head"><div><h1>Lançar laudo</h1><p class="mut">${EMP[S.emp==='rede'?'centro':S.emp].n} · o preço vem da tabela do cliente.</p></div></div>

  ${tab==='unico'?`<div class="grid g21"><div class="card">${form}</div><div class="card" style="display:flex;flex-direction:column;gap:12px"><div id="lpanel" style="display:flex;flex-direction:column;gap:12px">${p.html}</div>
    <button class="btn" id="b-lan" data-a="lancar"${p.dup&&!can('desconto')?' disabled':''}>Lançar laudo</button></div></div>`:`<div class="card">${lote}</div>`}
  <div class="card"><h2>Lançados hoje</h2><div class="tw" style="margin-top:8px"><table><thead><tr><th>Hora</th><th>Placa</th><th>Cliente</th><th>Serviço</th><th>Vistoriador</th><th>Pagamento</th><th class="num">Valor</th><th></th></tr></thead><tbody id="hoje">${LAUDOS.filter(x=>S.role!=='VIS'||x.vist==='Ana Souza').map(x=>`<tr><td>${x.h}</td><td><b>${x.placa}</b></td><td>${x.cliente}</td><td>${x.serv}</td><td>${x.vist}</td><td>${x.forma}</td><td class="num">${R(x.valor)}</td><td>${x.manual?'<span class="pill p-par">! Preço manual</span>':''}</td></tr>`).join('')}</tbody></table></div>
  <p class="mut sm" style="margin-top:8px">${S.role==='VIS'?'Você vê só os seus laudos. Pode editar o de hoje enquanto não for faturado, baixado ou o caixa fechado, e pode solicitar cancelamento.':'Cancelar laudo exige motivo e a autorização do gerente.'}</p></div>`};

V.receber=()=>{const rows=T,tot=[...S.sel].reduce((s,i)=>s+T[i].saldo,0);
 return `<div class="head"><div><h1>A receber</h1><p class="mut">Cada laudo gera um título. Baixa total ou parcial, individual ou em lote.</p></div></div>
 <div class="card"><div class="row" style="margin-bottom:12px"><div class="fld"><label for="r-c">Cliente</label><select id="r-c"><option>Todos</option>${Object.keys(CLIENTES).map(c=>`<option>${c}</option>`)}</select></div>

 <div class="tw"><table><thead><tr><th><input type="checkbox" data-a="sel-all" aria-label="Selecionar todos"></th><th>Laudo</th><th>Placa</th><th>Cliente</th><th>Serviço</th><th>Vencimento</th><th>Forma</th><th class="num">Valor</th><th class="num">Saldo</th><th>Situação</th></tr></thead>
 <tbody>${rows.map(t=>`<tr class="${S.sel.has(t.id)?'sel':''}"><td><input type="checkbox" data-a="sel" data-v="${t.id}" aria-label="Selecionar ${t.laudo}"${t.saldo===0?' disabled':''}${S.sel.has(t.id)?' checked':''}></td><td>${t.laudo}</td><td><b>${t.placa}</b></td><td>${t.cliente}</td><td>${t.serv}</td><td>${D(t.venc)}</td><td>${t.forma}</td><td class="num">${R(t.valor)}</td><td class="num">${R(t.saldo)}</td><td>${pill(stT(t))}</td></tr>`).join('')}</tbody>
 <tfoot><tr><td colspan="7">Total em aberto</td><td class="num">${R(T.reduce((s,t)=>s+t.valor,0))}</td><td class="num">${R(T.reduce((s,t)=>s+t.saldo,0))}</td><td></td></tr></tfoot></table></div></div>
 ${S.sel.size?`<div class="act"><span><b>${S.sel.size}</b> título(s) · ${R(tot)}</span><button class="btn" data-a="baixar">Baixar selecionados</button></div>`:''}`};
function jurosDe(ts){let m=0,j=0;ts.forEach(t=>{if(t.venc<HOJE){const d=dias(t.venc,HOJE);m+=t.saldo*.02;j+=t.saldo*.01*d/30}});return {m,j}}
function drawerBaixa(){const ts=[...S.sel].map(i=>T[i]),sub=ts.reduce((s,t)=>s+t.saldo,0),{m,j}=jurosDe(ts);
 modal(`<div class="row" style="justify-content:space-between"><h2>Baixar ${ts.length} título(s)</h2><button class="btn sec sm2" data-a="fechar">Fechar</button></div>
 <div class="fld"><label for="b-d">Data do recebimento</label><input id="b-d" value="27/10/2026"></div>
 <div class="fld"><label for="b-f">Forma de pagamento</label><select id="b-f">${FORMAS.slice(0,5).map(f=>`<option>${f}</option>`)}</select></div>
 <div class="fld"><label for="b-c">Conta financeira</label><select id="b-c"><option>Caixa Loja Centro</option><option>Banco Itaú · c/c 12345-6</option></select></div>
 <div class="card line"><div class="row" style="justify-content:space-between"><span>Saldo dos títulos</span><b class="num">${R(sub)}</b></div>
  <div class="row" style="justify-content:space-between"><span>Multa (2%)</span><b class="num">${R(m)}</b></div>
  <div class="row" style="justify-content:space-between"><span>Juros (1% ao mês, por dia)</span><b class="num">${R(j)}</b></div>
  <hr style="border:0;border-top:1px solid var(--borda);margin:8px 0"><div class="row" style="justify-content:space-between"><b>Total a receber</b><b class="num" style="font-size:20px;color:var(--verde)">${R(sub+m+j)}</b></div></div>
 <div class="fld"><label for="b-v">Valor recebido (R$)</label><input id="b-v" value="${(sub+m+j).toFixed(2).replace('.',',')}"><small>Menor que o total gera baixa parcial.</small></div>
 ${can('estornar')?'<p class="mut sm">Juros e multa podem ser reduzidos por quem tem permissão, com motivo.</p>':''}
 <button class="btn" data-a="conf-baixa">Confirmar baixa</button>`,true)}

function fatFiltradas(){const F=S.ff;return FAT.filter(x=>{const d=F.por==='emi'?x.emi:x.venc;return (F.cli==='Todos'||x.cliente===F.cli)&&(!F.de||d>=F.de)&&(!F.ate||d<=F.ate)&&(F.st==='Todas'||(F.st==='Vencidas'?x.venc<HOJE&&x.saldo>0:F.st==='Parciais'?x.saldo>0&&x.saldo<x.valor:x.saldo===x.valor&&x.venc>=HOJE))})}
function filtroFat(n){const F=S.ff,so=(id,k,l,o)=>`<div class="fld"><label for="${id}">${l}</label><select id="${id}" data-ff="${k}">${o.map(x=>Array.isArray(x)?`<option value="${x[0]}"${x[0]===F[k]?' selected':''}>${x[1]}</option>`:`<option${x===F[k]?' selected':''}>${x}</option>`).join('')}</select></div>`;
 return `<div class="card"><div class="row">${so('ff-c','cli','Cliente',['Todos',...Object.keys(CLIENTES)])}${so('ff-p','por','Filtrar por',[['venc','Vencimento'],['emi','Emissão']])}
 <div class="fld"><label for="ff-de">De</label><input id="ff-de" type="date" data-ff="de" value="${F.de}"></div><div class="fld"><label for="ff-ate">Até</label><input id="ff-ate" type="date" data-ff="ate" value="${F.ate}"></div>
 ${so('ff-s','st','Situação',['Todas','Em aberto','Vencidas','Parciais'])}</div>
 <div class="row" style="margin-top:12px;justify-content:space-between;align-items:center"><div class="row"><button class="chip" data-a="ff-preset" data-v="mes">Este mês</button><button class="chip" data-a="ff-preset" data-v="30">Últimos 30 dias</button><button class="chip" data-a="ff-preset" data-v="venc">Só vencidas</button><button class="chip" data-a="ff-limpar">Limpar filtros</button></div><span class="mut sm">${n} de ${FAT.length} faturas</span></div></div>`}
V.faturados=()=>{const FL=fatFiltradas(),f=FL.find(x=>x.n===S.fat)||FL[0],st=x=>x.saldo===0?'ok':(x.venc<HOJE?'venc':(x.saldo<x.valor?'par':'open')),tot=[...S.selF].reduce((s,n)=>s+FAT.find(x=>x.n===n).saldo,0);
 const emAberto=FL.reduce((s,x)=>s+x.saldo,0),venc=FL.filter(x=>x.venc<HOJE).reduce((s,x)=>s+x.saldo,0);
 return `<div class="head"><div><h1>Faturados</h1><p class="mut">Uma fatura por empresa, cliente e período. Se o cliente usa duas lojas, recebe duas faturas.</p></div>
  <div class="row"><button class="btn sec" data-a="gerar-faturas">Gerar faturas do período</button></div></div>
  ${filtroFat(FL.length)}
  <div class="grid g3"><div class="card kpi"><div class="l">Faturado em aberto</div><div class="v">${R(emAberto)}</div></div><div class="card kpi"><div class="l">Vencido</div><div class="v" style="color:var(--erro)">${R(venc)}</div></div><div class="card kpi"><div class="l">Faturas abertas</div><div class="v">${FL.length}</div></div></div>
  <div class="card"><div class="tw"><table><thead><tr><th><input type="checkbox" aria-label="Selecionar todas" data-a="selF-all"></th><th>Fatura</th><th>Cliente</th><th>Período</th><th>Vencimento</th><th class="num">Laudos</th><th class="num">Saldo</th><th>Situação</th></tr></thead>
  <tbody>${FL.length?'':'<tr><td colspan="8" class="mut" style="padding:24px">Nenhuma fatura com esses filtros. Use “Limpar filtros” para ver todas.</td></tr>'}${FL.map(x=>`<tr class="${S.selF.has(x.n)?'sel':''}"><td><input type="checkbox" data-a="selF" data-v="${x.n}" aria-label="Selecionar ${x.n}"${S.selF.has(x.n)?' checked':''}></td><td><button class="chip" style="min-height:30px" data-a="fat" data-v="${x.n}" aria-pressed="${x.n===f.n}">${x.n}</button></td><td>${x.cliente}</td><td>${x.per}</td><td>${D(x.venc)}</td><td class="num">${x.lau}</td><td class="num">${R(x.saldo)}</td><td>${pill(st(x))}</td></tr>`).join('')}</tbody></table></div></div>
  ${S.selF.size?`<div class="act"><span><b>${S.selF.size}</b> fatura(s) · ${R(tot)}</span><button class="btn" data-a="baixa-fat">Baixar em lote</button></div>`:''}
  ${f?docFatura(f):''}`};
function docFatura(f){const cf=contasFatura('Loja Centro'),d=f.venc<HOJE?dias(f.venc,HOJE):0,mu=d?f.saldo*.02:0,ju=d?f.saldo*.01*d/30:0;
 const it=[['RTX4F21','Cautelar',180],['QWE1R23','Transferência',120],['FGT5H42','Procedência',150],['VBN7K12','Cautelar',180]],s=it.reduce((a,b)=>a+b[2],0);
 return `<div class="card"><div class="head" style="margin-bottom:12px"><h2>Prévia da fatura ${f.n}</h2><div class="row"><button class="btn sec sm2" data-a="pdf">Gerar PDF</button><button class="btn sec sm2" data-a="email">Enviar por e-mail</button><button class="btn sm2" data-a="baixa-fat1" data-v="${f.n}">Baixar fatura</button></div></div>
 ${cf.length?'':'<div class="msg warn" style="margin-bottom:12px"><span aria-hidden="true">!</span><div><b>Esta fatura sai sem dados para pagamento.</b> Nenhuma conta da Loja Centro está marcada para aparecer na fatura. Cadastre em Cadastros › Empresas › Contas bancárias.</div></div>'}${cf.find(c=>c.pix)?'<div class="msg info" style="margin-bottom:12px"><span aria-hidden="true">i</span><div>O QR Code vale para o <b>total desta fatura com juros e multa até hoje</b>. Ele não confirma o pagamento sozinho: confira o extrato e baixe a fatura.</div></div>':''}<div class="doc"><div class="lh"><div class="lbox">${S.brand.logo?`<img src="${S.brand.logo}" alt="Logo da loja">`:'LOGO DA LOJA'}</div><div style="text-align:right"><b style="font-size:16px;color:var(--verde)">FATURA ${f.n}</b><div class="sm mut">Emissão ${D(f.emi)} · Vencimento ${D(f.venc)}</div></div></div>
 <div class="sm" style="margin-bottom:10px"><b>Loja Centro</b> · CNPJ 12.345.678/0001-90<br>Cliente: <b>${f.cliente}</b> · Período: ${f.per}</div>
 <table><thead><tr><th>Placa</th><th>Serviço</th><th class="num">Valor</th></tr></thead><tbody>${it.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="num">${R(r[2])}</td></tr>`).join('')}<tr><td colspan="2" class="mut">Demais ${f.lau-4} laudos</td><td class="num">${R(f.valor-s)}</td></tr></tbody>
 <tfoot><tr><td colspan="2">Valor da fatura</td><td class="num">${R(f.valor)}</td></tr>${f.valor!==f.saldo?`<tr><td colspan="2" class="mut">Já pago</td><td class="num">− ${R(f.valor-f.saldo)}</td></tr>`:''}${d?`<tr><td colspan="2" class="mut">Multa 2% + juros (${d} dia${d>1?'s':''})</td><td class="num">${R(mu+ju)}</td></tr>`:''}<tr><td colspan="2">Total a pagar</td><td class="num">${R(f.saldo+mu+ju)}</td></tr></tfoot></table>
 ${cf.length?`<div style="margin-top:14px;border:1.5px solid var(--brand);border-radius:8px;padding:12px"><b style="color:var(--verde)">Como pagar</b>${(()=>{const pc=cf.find(c=>c.pix);if(!pc)return '';const code=pixPayload(pc,f.saldo+mu+ju,f.n),svg=qrSvg(code);return `<div class="row" style="flex-wrap:nowrap;align-items:center;gap:16px;margin-top:10px"><div style="width:132px;flex:none;background:#fff">${svg||'<div class=\'sm mut\'>QR indisponível offline</div>'}</div><div class="sm" style="min-width:0"><b>Pague com PIX</b><br>Aponte a câmera do app do banco para o QR Code. Valor: <b>${R(f.saldo+mu+ju)}</b>.<div class="mut" style="margin-top:6px">Pix copia e cola</div><div style="word-break:break-all;font-size:10px;line-height:14px;background:#F4F6F2;border-radius:6px;padding:6px;margin:4px 0" id="pixcode">${code}</div><button class="btn sec sm2" type="button" data-a="copy-pix">Copiar código</button></div></div>`})()}${cf.map(c=>`<div class="sm" style="margin-top:8px;line-height:20px">${c.ag?`Transferência ou TED: <b>${c.banco}</b> · Ag. <b>${c.ag}</b> · Conta ${c.tipo.toLowerCase()} <b>${c.cc}</b><br>`:`Banco: <b>${c.banco}</b><br>`}Titular: ${c.titular} · CNPJ ${c.doc}${c.pix?`<br>PIX (${c.pixT}): <b>${c.pix}</b>`:''}</div>`).join('')}<div class="sm mut" style="margin-top:8px">Após o pagamento, envie o comprovante ao financeiro informando o nº da fatura.</div></div>`:''}
 <p class="sm mut" style="margin-top:12px">Ref. NF: ______ · Ref. boleto: ______ (preenchidos por fora do sistema)</p></div></div>`}

V.pagar=()=>{const stP=p=>p.st==='Pago'?['p-ok','✓ Pago']:p.st==='Aguardando aprovação'?['p-info','◔ Aguardando aprovação']:(p.venc<HOJE?['p-venc','! Vencido']:['p-open','○ Aprovado']);
 const aberto=PAG.filter(p=>p.st!=='Pago').reduce((s,p)=>s+p.valor,0),venc=PAG.filter(p=>p.st!=='Pago'&&p.venc<HOJE).reduce((s,p)=>s+p.valor,0),ag=PAG.filter(p=>p.st==='Aguardando aprovação').length;
 return `<div class="head"><div><h1>A pagar</h1><p class="mut">Inclui recorrências, royalties, comissões, custos de laudo e rateios gerados pelo sistema.</p></div><button class="btn" data-a="novo-pagar">Novo título</button></div>
 <div class="grid g3"><div class="card kpi"><div class="l">A pagar em aberto</div><div class="v">${R(aberto)}</div></div><div class="card kpi"><div class="l">Vencidos</div><div class="v" style="color:var(--erro)">${R(venc)}</div></div><div class="card kpi"><div class="l">Aguardando aprovação</div><div class="v">${ag}</div></div></div>
 ${!can('aprovar')?'<div class="msg info"><span aria-hidden="true">i</span><div>Seu perfil cria e paga títulos, mas a aprovação fica com o Gerente ou o Administrativo. Quem cria não aprova.</div></div>':''}
 <div class="card"><div class="tw"><table><thead><tr><th>Descrição</th><th>Fornecedor</th><th>Origem</th><th>Vencimento</th><th class="num">Valor</th><th>Situação</th><th></th></tr></thead><tbody>${PAG.map(p=>{const s=stP(p);return `<tr><td><b>${p.desc}</b></td><td>${p.forn}</td><td><span class="pill p-open">${p.orig}</span></td><td>${D(p.venc)}</td><td class="num">${R(p.valor)}</td><td><span class="pill ${s[0]}">${s[1]}</span></td>
 <td>${p.st==='Aguardando aprovação'?(can('aprovar')?`<button class="btn sm2" data-a="aprovar" data-v="${p.id}">Aprovar</button>`:'<span class="lock">🔒 só Gerente ou Administrativo</span>'):p.st==='Aprovado'?`<button class="btn sec sm2" data-a="pagar" data-v="${p.id}">Registrar pagamento</button>`:''}</td></tr>`}).join('')}</tbody></table></div></div>`};

V.caixa=()=>{const cartao=[['28/10','Débito','Cielo',1240,1.19,0],['29/10','Crédito 1x','Cielo',2860,2.69,0],['25/11','Crédito 2x (parcela 1)','Cielo',1500,3.89,0],['30/10','Crédito 1x (antecipado)','Rede',3200,2.69,1.8]];
 const liq=r=>r[3]*(1-(r[4]+r[5])/100);
 return `<div class="head"><div><h1>Caixa</h1><p class="mut">Contas financeiras, movimentos e previsão de cartão. Saldo vem dos lançamentos, nunca é digitado.</p></div></div>
 <div class="grid g3"><div class="card kpi"><div class="l">Caixa Loja Centro</div><div class="v">${R(3420)}</div></div><div class="card kpi"><div class="l">Banco Itaú · c/c 12345-6</div><div class="v">${R(58730.15)}</div></div><div class="card kpi"><div class="l">Cartão a receber (previsto)</div><div class="v">${R(cartao.reduce((s,r)=>s+liq(r),0))}</div></div></div>
 <div class="grid g21"><div class="card"><h2>Movimentos de hoje</h2><div class="tw" style="margin-top:8px"><table><thead><tr><th>Hora</th><th>Descrição</th><th>Conta</th><th class="num">Valor</th></tr></thead><tbody>

    L.placa='';L.manual='';L.desc=0;L.num='';L.obs='';toast('Laudo lançado.');render();setTimeout(()=>{const f=$('#f-placa');if(f)f.focus()},0)}
  else if(a==='lote'){toast('Lote lançado. Laudos sem placa foram ignorados.')}
  else if(a==='sel'){const i=+v;S.sel.has(i)?S.sel.delete(i):S.sel.add(i);render()}
  else if(a==='sel-all'){const all=T.filter(t=>t.saldo>0);S.sel.size===all.length?S.sel.clear():all.forEach(t=>S.sel.add(t.id));render()}
  else if(a==='baixar')drawerBaixa();
  else if(a==='conf-baixa'){fechar();T.filter(t=>S.sel.has(t.id)).forEach(t=>t.saldo=0);S.sel.clear();toast('Baixa registrada. Lançamento de caixa gerado.');render()}
  else if(a==='fat'){S.fat=v;render()}
  else if(a==='selF'){S.selF.has(v)?S.selF.delete(v):S.selF.add(v);render()}
  else if(a==='selF-all'){{const L2=fatFiltradas();S.selF.size===L2.length?S.selF.clear():L2.forEach(f=>S.selF.add(f.n));render()}}
  else if(a==='baixa-fat'||a==='baixa-fat1'){if(a==='baixa-fat1'){S.selF.clear();S.selF.add(v)}
    const fs=FAT.filter(f=>S.selF.has(f.n)),tot=fs.reduce((s,f)=>s+f.saldo+(f.venc<HOJE?f.saldo*(.02+.01*dias(f.venc,HOJE)/30):0),0);
    modal(`<div class="row" style="justify-content:space-between"><h2>Baixar ${fs.length} fatura(s)</h2><button class="btn sec sm2" data-a="fechar">Fechar</button></div>
    <div class="card line">${fs.map(f=>`<div class="row" style="justify-content:space-between"><span>${f.n} · ${f.cliente}</span><b class="num">${R(f.saldo)}</b></div>`).join('')}<hr style="border:0;border-top:1px solid var(--borda);margin:8px 0"><div class="row" style="justify-content:space-between"><b>Total com juros e multa</b><b class="num" style="color:var(--verde)">${R(tot)}</b></div></div>
    <div class="fld"><label for="bf-v">Valor recebido (R$)</label><input id="bf-v" value="${tot.toFixed(2).replace('.',',')}"><small>Parcial é aceito e rateado entre os laudos mais antigos primeiro.</small></div>
    <div class="fld"><label for="bf-c">Conta financeira</label><select id="bf-c"><option>Banco Itaú · c/c 12345-6</option><option>Caixa Loja Centro</option></select></div>
    <button class="btn" data-a="conf-fat">Confirmar baixa</button>`,true)}
  else if(a==='conf-fat'){FAT.filter(f=>S.selF.has(f.n)).forEach(f=>f.saldo=0);S.selF.clear();fechar();toast('Faturas baixadas. Títulos dos laudos quitados.');render()}
  else if(a==='gerar-faturas'){toast('3 faturas geradas para os clientes com fechamento hoje.')}
  else if(a==='pdf'){toast('PDF da fatura gerado com o logo da loja.')}
  else if(a==='email'){toast('E-mail de cobrança enviado para financeiro@autocenterpremium.com.br')}
  else if(a==='exp'){toast('Exportação em '+v+' registrada no log e enviada para download.')}
  else if(a==='aprovar'){PAG[+v].st='Aprovado';toast('Pagamento aprovado.');render()}
  else if(a==='pagar'){PAG[+v].st='Pago';toast('Pagamento registrado. Saída lançada no caixa.');render()}
  else if(a==='novo-pagar'){DRAFT={};drawerPagar()}
  else if(a==='novo-forn'){modalForn(false)}
  else if(a==='forn-do-titulo'){DRAFT={d:$('#np1').value,c:$('#np3').value,v:$('#np4').value,x:$('#np5').value,r:$('#np6').value};modalForn(true)}
  else if(a==='salvar-forn'){const n=$('#fn1').value.trim(),d=$('#fn2').value.trim();if(!n||!d){toast('Informe o nome e o CPF ou CNPJ.');return}
    FORN.push([n,d,$('#fn3').value,$('#fn4').value||'—',$('#fn5').value]);DRAFT.f=n;toast('Fornecedor cadastrado.');if(el.dataset.v==='1'){drawerPagar()}else{fechar();render()}}
  else if(a==='x-novo-pagar-old'){modal(`<div class="row" style="justify-content:space-between"><h2>Novo título a pagar</h2><button class="btn sec sm2" data-a="fechar">Fechar</button></div>
    <div class="fld"><label for="np1">Descrição *</label><input id="np1"></div><div class="fld"><label for="np2">Fornecedor *</label><select id="np2"><option>Imobiliária Prado</option><option>Detran</option><option>Papelaria Central</option></select></div>
    <div class="fld"><label for="np3">Conta do plano *</label><select id="np3"><option>Despesas operacionais › Aluguel</option><option>Despesas operacionais › Administrativas</option></select></div>
    <div class="grid g2"><div class="fld"><label for="np4">Vencimento *</label><input id="np4" value="05/11/2026"></div><div class="fld"><label for="np5">Valor (R$) *</label><input id="np5"></div></div>
    <div class="fld"><label for="np6">Repetir</label><select id="np6"><option>Não repetir</option><option>Todo mês</option></select></div><div class="fld"><label for="np7">Comprovante</label><input id="np7" type="file"></div><button class="btn" data-a="salvar-pagar">Salvar título</button>`,true)}
  else if(a==='salvar-pagar'){fechar();toast(can('aprovar')?'Título criado e aprovado.':'Título criado. Aguarda aprovação do Gerente.')}
  else if(a==='fechar-caixa'){toast('Caixa do dia 27/10 fechado.')}
  else if(a==='cli'){S.cli=v;render()}
  else if(a==='novo-cli'||a==='novo-grupo'){const g=a==='novo-grupo';modal(`<div class="row" style="justify-content:space-between"><h2>${g?'Novo grupo':'Novo cliente'}</h2><button class="btn sec sm2" data-a="fechar">Fechar</button></div>
    <div class="fld"><label for="n1">${g?'Nome do grupo':'Nome ou razão social'} *</label><input id="n1"></div><div class="fld"><label for="n2">${g?'CNPJ da primeira empresa':'CPF ou CNPJ'} *</label><input id="n2"></div>
    <div class="fld"><label for="n3">${g?'E-mail do primeiro Administrativo':'E-mail de cobrança'} *</label><input id="n3"></div><button class="btn" data-a="${g?'salvar-grupo':'salvar-cli'}">Salvar</button>`)}
  else if(a==='salvar-grupo'){const n=$('#n1').value.trim()||'Novo grupo';GRUPOS.unshift([n,1,1,'Ativo','27/10/2026']);fechar();toast('Grupo criado. Convite enviado ao primeiro Administrativo.');render()}
  else if(a==='salvar-cli'){fechar();toast('Cliente cadastrado. Disponível para todas as lojas do grupo.')}
  else if(a==='novo-preco'){modal(`<div class="row" style="justify-content:space-between"><h2>Cadastrar preço</h2><button class="btn sec sm2" data-a="fechar">Fechar</button></div><p class="mut sm">Vale para todas as lojas do grupo, a partir da data de início.</p>
    <div class="fld"><label for="pp1">Serviço</label><select id="pp1">${SERV.map(s=>`<option${s===v?' selected':''}>${s}</option>`).join('')}</select></div><div class="grid g2"><div class="fld"><label for="pp2">Valor (R$) *</label><input id="pp2"></div><div class="fld"><label for="pp3">Início da vigência *</label><input id="pp3" value="27/10/2026"></div></div><button class="btn" data-a="salvar-preco">Salvar preço</button>`)}
  else if(a==='reajustar'){modal(`<div class="row" style="justify-content:space-between"><h2>Reajustar ${v}</h2><button class="btn sec sm2" data-a="fechar">Fechar</button></div><div class="msg warn"><span aria-hidden="true">!</span><div>O novo valor passa a valer em <b>todas as lojas do grupo</b>. Laudos já lançados não mudam.</div></div>
    <div class="grid g2"><div class="fld"><label for="rj1">Novo valor (R$) *</label><input id="rj1"></div><div class="fld"><label for="rj2">Início da vigência *</label><input id="rj2" value="01/11/2026"></div></div><div class="fld"><label for="rj3">Motivo *</label><input id="rj3"></div><button class="btn" data-a="salvar-preco">Confirmar reajuste</button>`)}
  else if(a==='salvar-preco'){fechar();toast('Preço salvo. Histórico atualizado.')}
  else if(a==='salvar-tema'){toast('Tema salvo para '+S.brand.escopo+'. Relatórios e faturas já usam a nova identidade.')}
  else if(a==='reset-tema'){S.brand.cor='#104B3A';S.brand.logo=null;render()}
  else if(a==='susp'){const g=GRUPOS[+v];g[3]=g[3]==='Ativo'?'Suspenso':'Ativo';toast(g[3]==='Suspenso'?'Grupo suspenso. Usuários não conseguem entrar.':'Grupo reativado.');render()}
  else if(a==='entrar-como'){const g=GRUPOS[+v][0];modal(`<h2>Entrar como ${g}</h2><p class="mut sm">O acesso é registrado no log do cliente, tem banner visível e expira em 30 minutos.</p>
    <div class="fld"><label for="im">Motivo do acesso *</label><textarea id="im" data-in="imp" placeholder="Ex.: cliente não consegue baixar fatura (chamado 1234)"></textarea><small>Mínimo de 10 caracteres.</small></div>
    <div class="row"><button class="btn" id="im-ok" data-a="conf-imp" data-v="${g}" disabled>Entrar</button><button class="btn sec" data-a="fechar">Cancelar</button></div>`)}
  else if(a==='conf-imp'){S.imp={g:v,m:$('#im').value.trim()};S.role='ADM';fechar();location.hash='#dashboard';render()}
  else if(a==='sair-imp'){S.imp=null;location.hash='#backoffice'}
});
document.addEventListener('input',e=>{if(e.target.id==='im'){$('#im-ok').disabled=e.target.value.trim().length<10}});
render();
</script>
